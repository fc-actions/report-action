# action.yml
name: 'FireClover Reporter'
description: 'FireClover Vulnerability Management Reporter Tool'
branding:
  icon: 'align-left'  
  color: 'orange'
inputs:
  instance-url:
    description: 'The FireClover reporter instance url'
    required: true
    default: ''
  email:
    description: 'The email address to which the report will be sent.'
    required: false
    default: '' 
  result-file:  
    description: 'The path to the result file'
    required: true
    default: ''
  workspace:  
    description: 'The workspace to upload the result to'
    required: true
    default: ''
  username:  
    description: 'The username to login to the reporter tool'
    required: false
    default: 'faraday'
  password:  
    description: 'The password to login to the reporter tool'
    required: true
    default: ''
  create_repo_issues:
    description: 'Create vulnerabilities reported as issues in repository'
    required: false
    default: ['Critical', 'High']
  quiet:  
    description: 'Verbosity of the tool output'
    required: false
    default: true
  ignore-info-severity:  
    description: 'Ignore information severity vulnerabilities of the tool output'
    required: false
    default: true
  allow-style:  
    description: 'Verbosity style of the tool output (valid values:Always, Never, Terminal)'
    required: false
    default: ''
 
runs:
  using: "composite"
  steps:
    - if: ${{ inputs.create_repo_issues && contains(inputs.result-file, "grype") }}
      run: |  
        IFS=$'\n'
        for severity in ${{ inputs.create_repo_issues }}
        do
            for d in $(jq -r ".matches[].vulnerability|select(.severity == \"$severity\")|{\"title\":.id,\"body\":.description,\"labels\":[40,51],\"projects\":[${{ variables.VULN_MGMT_PROJECT_ID }}]}|@json" ${{ inputs.result-file }})
                do curl -H "content-type: application/json" -u "${{ secrets.ACTIONS_USER }}:${{ secrets.ACTIONS_TOKEN }}" "${{ github.api_url }}/api/v1/repos/${{ github.repository }}/issues" -d $d
            done
        done
      shell: bash

    - run: |  
        echo "Configuring FireClover Reporter"
        cp ${GITHUB_ACTION_PATH}/.faraday-cli.yml ~/.faraday-cli.yml
        pip install faraday-cli -q --break-system-packages|| pip3 install faraday-cli -q --break-system-packages # TODO use regular curl instead of python dependency
        faraday-cli auth -f "${{ inputs.instance-url }}" -u "${{ inputs.username }}" -p "${{ inputs.password }}"
      shell: bash

    - if: ${{ !(inputs.ignore-info-severity && inputs.quiet) }}
      run: |  
        faraday-cli set quiet ${{ inputs.quiet }}
        faraday-cli set allow_style ${{ inputs.allow-style }}
        faraday-cli set ignore_info_severity ${{ inputs.ignore-info-severity }}
      shell: bash


    - run:   faraday-cli tool report "${{ inputs.result-file }}" -w "${{ inputs.workspace }}" 
      shell: bash
